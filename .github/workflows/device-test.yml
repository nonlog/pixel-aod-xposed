name: Device Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: ADB runner to use
        required: true
        type: choice
        default: jp
        options:
          - jp
          - tyo

permissions:
  contents: read

concurrency:
  group: pixel-aod-device
  cancel-in-progress: false

jobs:
  build:
    name: Build candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: device-candidate
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  device-jp:
    name: Install and health-check on JP path
    if: ${{ inputs.target == 'jp' }}
    needs: build
    runs-on: [self-hosted, linux, x64, pixel-aod-jp]
    timeout-minutes: 15
    steps:
      - name: Checkout device-test scripts
        uses: actions/checkout@v4
      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: device-candidate
          path: candidate
      - name: Install and validate
        env:
          ADB_TARGET: 127.0.0.1:15556
        shell: bash
        run: ./scripts/ci-device-test.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-diagnostics-jp-${{ github.run_id }}
          path: device-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  device-tyo:
    name: Install and health-check on TYO path
    if: ${{ inputs.target == 'tyo' }}
    needs: build
    runs-on: [self-hosted, linux, x64, pixel-aod-tyo]
    timeout-minutes: 15
    steps:
      - name: Checkout device-test scripts
        uses: actions/checkout@v4
      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: device-candidate
          path: candidate
      - name: Install and validate
        env:
          ADB_TARGET: 127.0.0.1:15557
        shell: bash
        run: ./scripts/ci-device-test.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-diagnostics-tyo-${{ github.run_id }}
          path: device-diagnostics
          if-no-files-found: ignore
          retention-days: 7
