name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Android lint audit
        id: lint
        shell: bash
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Summarize verification
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              suite = ET.parse(path).getroot()
              tests += int(suite.get('tests', 0))
              failures += int(suite.get('failures', 0))
              errors += int(suite.get('errors', 0))
              skipped += int(suite.get('skipped', 0))
          print(f'UNIT_TEST_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped}')
          for path in glob.glob('app/build/reports/lint-results-debug.xml'):
              issues = ET.parse(path).getroot().findall('issue')
              counts = collections.Counter((issue.get('severity'), issue.get('id')) for issue in issues)
              print('LINT_SUMMARY', dict(counts))
              for issue in issues:
                  if issue.get('severity') in ('Error', 'Fatal'):
                      print('LINT_ERROR', issue.get('id'), issue.get('message'))
                      for loc in issue.findall('location'):
                          print(loc.attrib)
          PY

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Record APK digest
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.sha256
          echo '### Debug APK' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat app-debug.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-aod-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
