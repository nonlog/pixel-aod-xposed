plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.compose")
}

android {
    namespace "dev.codex.pixelaod"
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "dev.codex.pixelaod"
        minSdk 26
        targetSdk 36
        versionCode 9045
        versionName "0.1.46"
    }

    signingConfigs {
        debug {
            if (file("${rootDir}/debug.keystore").exists()) {
                storeFile file("${rootDir}/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            def keystorePath = System.getenv("PIXEL_AOD_KEYSTORE_FILE")
            def storePass = System.getenv("PIXEL_AOD_KEYSTORE_PASSWORD")
            def aliasName = System.getenv("PIXEL_AOD_KEY_ALIAS")
            def keyPass = System.getenv("PIXEL_AOD_KEY_PASSWORD")
            if (keystorePath && storePass && aliasName && keyPass && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword storePass
                keyAlias aliasName
                keyPassword keyPass
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.10.00")
    implementation(composeBom)
    implementation("androidx.activity:activity-compose:1.9.3")
    implementation("androidx.compose.foundation:foundation")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.material3:material3")
    implementation("io.github.kyuubiran.ezxhelper:xposed-api-101:3.2.0-preview1") {
        exclude group: "io.github.libxposed", module: "api"
    }
    compileOnly(project(":libxposed-stubs"))
    testImplementation("junit:junit:4.13.2")
    // Android's org.json methods are framework stubs in local JVM tests; use the same API's
    // reference implementation so provider-payload parsing has executable regression coverage.
    testImplementation("org.json:json:20240303")
}
